<!DOCTYPE html>
<html>
<head>
    <title>Fake News Generator</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 80px; background: #f4f4f4; }
        .card { background: white; padding: 30px; width: 60%; margin: auto; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
        button { padding: 12px 25px; font-size: 16px; cursor: pointer; }
        h1 { color: #333; }
        p { font-size: 18px; color: #444; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📰 Fake News Generator (Satire)</h1>

        {% if headline %}
            <p><b>{{ headline }}</b></p>
        {% else %}
            <p>Click the button to generate a fake news headline</p>
        {% endif %}

        <form method="post">
            <button type="submit">Generate Fake News</button>
        </form>
    </div>
</body>
</html>
